<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- 背景渐变：深邃科技暗夜蓝黑 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- 边框细微光泽渐变 -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5"/>
    </linearGradient>

    <!-- 黄金镶边渐变 -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- 枫叶红宝石渐变 -->
    <linearGradient id="mapleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="35%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- 宝箱主体渐变 -->
    <linearGradient id="chestBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 宝箱盖渐变 -->
    <linearGradient id="chestLidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- 能量溢出金光 -->
    <linearGradient id="glowLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 蓝宝石晶体渐变 -->
    <linearGradient id="gemBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- 金宝石晶体渐变 -->
    <linearGradient id="gemGoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- 紫晶石晶体渐变 -->
    <linearGradient id="gemPurpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- 柔和发光滤镜 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. 圆角主外框 (Squircle) -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#borderGrad)" stroke-width="1.5" fill="none"/>

  <!-- 2. 背景微光射线 -->
  <circle cx="32" cy="24" r="16" fill="#3b82f6" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="32" cy="18" r="8" fill="#f59e0b" opacity="0.2" filter="url(#softGlow)"/>

  <!-- 3. 悬浮的数字资源晶体 (代表多源软件、工具、模版聚合) -->
  <!-- 蓝宝石 -->
  <g transform="translate(19, 13)">
    <polygon points="4,0 7.5,4.5 4,9 0.5,4.5" fill="url(#gemBlueGrad)"/>
    <polygon points="4,0 7.5,4.5 4,4.5" fill="#bae6fd" opacity="0.6"/>
  </g>
  <!-- 中间高位金宝石 -->
  <g transform="translate(28, 6.5)">
    <polygon points="4,0 8,5.5 4,11 0,5.5" fill="url(#gemGoldGrad)"/>
    <polygon points="4,0 8,5.5 4,5.5" fill="#fef9c3" opacity="0.7"/>
  </g>
  <!-- 紫水晶 -->
  <g transform="translate(39, 13)">
    <polygon points="3.5,0 7,4.5 3.5,9 0,4.5" fill="url(#gemPurpleGrad)"/>
    <polygon points="3.5,0 7,4.5 3.5,4.5" fill="#f5d0fe" opacity="0.6"/>
  </g>

  <!-- 星芒闪烁点 -->
  <!-- 左星芒 -->
  <path d="M14 17 L15 15 L17 14 L15 13 L14 11 L13 13 L11 14 L13 15 Z" fill="#38bdf8"/>
  <!-- 右星芒 -->
  <path d="M48 16 L49 14.5 L50.5 13.5 L49 12.5 L48 11 L47 12.5 L45.5 13.5 L47 14.5 Z" fill="#fde047"/>
  <!-- 微星芒 -->
  <circle cx="37" cy="8" r="0.8" fill="#ffffff"/>
  <circle cx="25" cy="12" r="0.7" fill="#ffffff"/>

  <!-- 4. 藏宝阁宝箱箱体 (Treasure Chest Base) -->
  <rect x="13" y="34" width="38" height="18" rx="4" fill="url(#chestBodyGrad)"/>
  
  <!-- 金属包边角码 -->
  <path d="M13 36 C13 34.9 13.9 34 15 34 H18 V38 H13 V36 Z" fill="url(#goldGrad)"/>
  <path d="M51 36 C51 34.9 50.1 34 49 34 H46 V38 H51 V36 Z" fill="url(#goldGrad)"/>
  <path d="M13 50 C13 51.1 13.9 52 15 52 H18 V48 H13 V50 Z" fill="url(#goldGrad)"/>
  <path d="M51 50 C51 51.1 50.1 52 49 52 H46 V48 H51 V50 Z" fill="url(#goldGrad)"/>

  <!-- 箱体垂直金属饰条 -->
  <rect x="17" y="34" width="2" height="18" fill="url(#goldGrad)" opacity="0.6"/>
  <rect x="45" y="34" width="2" height="18" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- 宝箱接缝能量光带 (宝箱开启溢光) -->
  <rect x="12" y="32.8" width="40" height="2" rx="1" fill="url(#glowLineGrad)"/>
  <rect x="16" y="33.3" width="32" height="1" rx="0.5" fill="#ffffff" opacity="0.9"/>

  <!-- 5. 宝箱盖 (Chest Lid) -->
  <rect x="11.5" y="24" width="41" height="9.5" rx="3.5" fill="url(#chestLidGrad)"/>
  <!-- 箱盖金边 -->
  <rect x="11.5" y="24" width="41" height="2" rx="1" fill="url(#goldGrad)"/>
  <rect x="15" y="24" width="2" height="9.5" fill="url(#goldGrad)" opacity="0.7"/>
  <rect x="47" y="24" width="2" height="9.5" fill="url(#goldGrad)" opacity="0.7"/>

  <!-- 6. 核心图腾：立体切面金边红枫徽标 (Maple Leaf Emblem) -->
  <g transform="translate(32, 25)">
    <!-- 枫叶主身路径 (带微外金边阴影) -->
    <!-- 茎 -->
    <rect x="-1" y="6" width="2" height="4.5" rx="0.8" fill="url(#goldGrad)"/>
    
    <!-- 枫叶多角叶冠 (精致折纸宝石切面) -->
    <!-- 中心大叶尖 -->
    <polygon points="0,-10 3.8,-3.5 0,0 -3.8,-3.5" fill="url(#mapleGrad)" stroke="url(#goldGrad)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="0,-10 3.8,-3.5 0,-1.5" fill="#fda4af" opacity="0.35"/>

    <!-- 左主叶尖 -->
    <polygon points="-8.5,-5.5 -4.5,-0.5 -1,1.5 -5,-3" fill="url(#mapleGrad)" stroke="url(#goldGrad)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="-8.5,-5.5 -4.5,-0.5 -5,-3" fill="#f43f5e" opacity="0.5"/>

    <!-- 右主叶尖 -->
    <polygon points="8.5,-5.5 5,-3 1,1.5 4.5,-0.5" fill="url(#mapleGrad)" stroke="url(#goldGrad)" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="8.5,-5.5 5,-3 4.5,-0.5" fill="#fda4af" opacity="0.4"/>

    <!-- 左下副叶尖 -->
    <polygon points="-7.5,2.5 -4,2.5 -1.5,4 -4,0.5" fill="url(#mapleGrad)" stroke="url(#goldGrad)" stroke-width="0.9" stroke-linejoin="round"/>

    <!-- 右下副叶尖 -->
    <polygon points="7.5,2.5 4,0.5 1.5,4 4,2.5" fill="url(#mapleGrad)" stroke="url(#goldGrad)" stroke-width="0.9" stroke-linejoin="round"/>

    <!-- 枫叶中心聚宝光核 -->
    <circle cx="0" cy="0" r="1.5" fill="#fef08a" filter="url(#softGlow)"/>
  </g>

  <!-- 7. 宝箱锁扣 (Chest Buckle / Emblem Lock) -->
  <g transform="translate(29, 31.5)">
    <rect x="0" y="0" width="6" height="7.5" rx="1.8" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.5"/>
    <circle cx="3" cy="3.5" r="1.2" fill="#0f172a"/>
    <rect x="2.5" y="3.5" width="1" height="2" fill="#0f172a"/>
  </g>
</svg>
